name: CE7 Source and Terrain Discovery

on:
  push:
    branches: [tmp/ce7-illumination-20260822]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Fetch source post mirrors and candidate terrain endpoints
        shell: bash
        run: |
          set -u
          mkdir -p out/media

          fetch() {
            name="$1"
            url="$2"
            echo "Fetching ${url}"
            curl -L -A 'Mozilla/5.0' --connect-timeout 20 --max-time 120 \
              -sS -D "out/${name}.headers" "$url" -o "out/${name}" || true
            wc -c "out/${name}" 2>/dev/null || true
          }

          fetch fxtwitter.json 'https://api.fxtwitter.com/SegerYU/status/2091250852568932449'
          fetch vxtwitter.json 'https://api.vxtwitter.com/SegerYU/status/2091250852568932449'
          fetch syndication.json 'https://cdn.syndication.twimg.com/tweet-result?id=2091250852568932449&lang=en'
          fetch oembed.json 'https://publish.twitter.com/oembed?url=https://twitter.com/SegerYU/status/2091250852568932449&omit_script=1'
          fetch twstalker_seger.html 'https://ngntipkolamrenang.twstalker.com/SegerYU'
          fetch twstalker_mickey.html 'https://ngntipkolamrenang.twstalker.com/mickeywzx'

          python3 - <<'PY'
          import html
          import json
          import pathlib
          import re
          import requests

          out = pathlib.Path('out')
          texts = []
          report = []
          for p in out.iterdir():
              if p.is_file() and p.suffix in {'.json', '.html'}:
                  try:
                      texts.append(p.read_text(errors='ignore'))
                  except Exception:
                      pass
          text = '\n'.join(texts)

          urls = set()
          for match in re.findall(r"https?[^\s\"'<>]+", text):
              u = html.unescape(match).replace('\\/', '/').rstrip('},])\\')
              if any(host in u for host in ('pbs.twimg.com', 'video.twimg.com', 'twimg.com/media')):
                  urls.add(u)

          def walk(x):
              if isinstance(x, dict):
                  for v in x.values():
                      walk(v)
              elif isinstance(x, list):
                  for v in x:
                      walk(v)
              elif isinstance(x, str) and x.startswith('http'):
                  if any(host in x for host in ('pbs.twimg.com', 'video.twimg.com', 'twimg.com/media')):
                      urls.add(x)

          for p in out.glob('*.json'):
              try:
                  walk(json.loads(p.read_text()))
              except Exception:
                  pass

          for i, u in enumerate(sorted(urls)):
              try:
                  r = requests.get(u, timeout=120, headers={'User-Agent': 'Mozilla/5.0'})
                  ct = r.headers.get('content-type', '')
                  ext = '.bin'
                  if 'jpeg' in ct or 'jpg' in ct:
                      ext = '.jpg'
                  elif 'png' in ct:
                      ext = '.png'
                  elif 'webp' in ct:
                      ext = '.webp'
                  elif 'mp4' in ct:
                      ext = '.mp4'
                  fn = out / 'media' / f'media_{i:03d}{ext}'
                  fn.write_bytes(r.content)
                  report.append({'url': u, 'file': str(fn), 'status': r.status_code,
                                 'content_type': ct, 'bytes': len(r.content)})
              except Exception as e:
                  report.append({'url': u, 'error': repr(e)})
          (out / 'media_report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

          cat > out/terrain_urls.txt <<'EOF'
          https://pds.lroc.im-ldi.com/data/LRO-L-LROC-5-RDR-V1.0/LROLRC_2001/DATA/SDP/NAC_DTM/ESALL_SR12/NAC_DTM_ESALL_SR12.TIF
          https://pds.mcp.nasa.gov/data/store/img/lunar_reconnaissance_orbiter/pds4/lroc/lro-l-lroc-5-rdr/LROLRC_2001/DATA/SDP/NAC_DTM/ESALL_SR12/NAC_DTM_ESALL_SR12.TIF
          https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/Site04/Site04_final_adj_5mpp_surf.tif
          https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_80S_80MPP_ADJ.TIF
          EOF

          : > out/terrain_probe.txt
          while IFS= read -r url; do
            echo "=== ${url}" >> out/terrain_probe.txt
            curl -L -A 'Mozilla/5.0' --connect-timeout 20 --max-time 120 \
              -sS -I "$url" >> out/terrain_probe.txt 2>&1 || true
          done < out/terrain_urls.txt

          find out -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort | tee out/listing.txt

      - name: Upload discovery package
        uses: actions/upload-artifact@v4
        with:
          name: ce7-discovery
          path: out
          if-no-files-found: error
          retention-days: 1
