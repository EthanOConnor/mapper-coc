name: CE7 NAC DTM Footprint Query

on:
  push:
    branches: [tmp/ce7-illumination-20260822]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install GDAL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin python3-gdal python3-numpy unzip
      - name: Query LROC global NAC DTM footprint shapefile
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data out
          curl -L --retry 3 --retry-delay 2 \
            'https://pds.mcp.nasa.gov/data/store/img/lunar_reconnaissance_orbiter/pds4/lroc/lro-l-lroc-5-rdr/LROLRC_2001/EXTRAS/SHAPEFILE/NAC_DTMS/NAC_DTMS_360.ZIP' \
            -o data/NAC_DTMS_360.ZIP
          unzip -q data/NAC_DTMS_360.ZIP -d data/nac_dtms
          find data/nac_dtms -maxdepth 3 -type f -printf '%p\n' > out/files.txt
          /usr/bin/python3 - <<'PY'
          import json, math
          from pathlib import Path
          from osgeo import ogr, osr

          shp = next(Path('data/nac_dtms').rglob('*.shp'))
          ds = ogr.Open(str(shp))
          layer = ds.GetLayer(0)
          defn = layer.GetLayerDefn()
          fields = [defn.GetFieldDefn(i).GetName() for i in range(defn.GetFieldCount())]

          lon, lat = 123.5, -88.8
          point_geo = ogr.Geometry(ogr.wkbPoint)
          point_geo.AddPoint(lon, lat)

          src = layer.GetSpatialRef().Clone()
          src.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)
          dst = osr.SpatialReference()
          dst.ImportFromProj4('+proj=stere +lat_0=-90 +lon_0=0 +k=1 +R=1737400 +units=m +no_defs')
          dst.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)
          transform = osr.CoordinateTransformation(src, dst)
          point_xy = point_geo.Clone(); point_xy.Transform(transform)

          containing = []
          nearby = []
          layer.ResetReading()
          for feat in layer:
              geom = feat.GetGeometryRef()
              if geom is None:
                  continue
              attrs = {f: feat.GetField(f) for f in fields}
              contains = bool(geom.Contains(point_geo) or geom.Intersects(point_geo))
              gxy = geom.Clone(); gxy.Transform(transform)
              distance_m = float(gxy.Distance(point_xy))
              row = {'contains_site': contains, 'distance_to_footprint_m': distance_m, **attrs}
              if contains:
                  containing.append(row)
              if distance_m <= 50000:
                  nearby.append(row)

          nearby.sort(key=lambda r: r['distance_to_footprint_m'])
          result = {
              'site': {'latitude_deg': lat, 'longitude_east_deg': lon},
              'shapefile': str(shp), 'fields': fields,
              'containing_count': len(containing),
              'containing': containing,
              'nearest_30': nearby[:30],
          }
          Path('out/nac_dtm_query.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('out/nac_dtm_query.txt').write_text(
              'CONTAINING\n' + '\n'.join(str(x) for x in containing) +
              '\n\nNEAREST\n' + '\n'.join(str(x) for x in nearby[:30]), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          sha256sum data/NAC_DTMS_360.ZIP > out/shapefile_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ce7-nac-dtm-query
          path: out
          if-no-files-found: error
          retention-days: 1
