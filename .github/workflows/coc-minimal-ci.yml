name: CE7 NAC DTM Footprint Query

on:
  push:
    branches: [tmp/ce7-illumination-20260822]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install GDAL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin python3-gdal python3-numpy unzip
      - name: Query LROC global NAC DTM footprint shapefile
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data out
          curl -L --retry 3 --retry-delay 2 \
            'https://pds.mcp.nasa.gov/data/store/img/lunar_reconnaissance_orbiter/pds4/lroc/lro-l-lroc-5-rdr/LROLRC_2001/EXTRAS/SHAPEFILE/NAC_DTMS/NAC_DTMS_360.ZIP' \
            -o data/NAC_DTMS_360.ZIP
          unzip -q data/NAC_DTMS_360.ZIP -d data/nac_dtms
          find data/nac_dtms -maxdepth 5 -type f -printf '%p\n' | sort > out/files.txt
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          from osgeo import ogr, osr

          files = [p for p in Path('data/nac_dtms').rglob('*') if p.is_file()]
          shps = [p for p in files if p.suffix.lower() == '.shp']
          if not shps:
              raise RuntimeError(f'No shapefile found; files={files!r}')
          shp = shps[0]
          ds = ogr.Open(str(shp))
          if ds is None:
              raise RuntimeError(f'OGR could not open {shp}')
          layer = ds.GetLayer(0)
          defn = layer.GetLayerDefn()
          fields = [defn.GetFieldDefn(i).GetName() for i in range(defn.GetFieldCount())]

          lon, lat = 123.5, -88.8
          layer_srs = layer.GetSpatialRef()
          if layer_srs is None:
              raise RuntimeError('Footprint shapefile has no SRS')
          layer_srs = layer_srs.Clone()
          layer_srs.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)
          geo_srs = osr.SpatialReference()
          geo_srs.ImportFromProj4('+proj=longlat +R=1737400 +no_defs')
          geo_srs.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)

          point_geo = ogr.Geometry(ogr.wkbPoint)
          point_geo.AddPoint(lon, lat)
          if not layer_srs.IsSameGeogCS(geo_srs) or not layer_srs.IsGeographic():
              to_layer = osr.CoordinateTransformation(geo_srs, layer_srs)
              point_layer = point_geo.Clone(); point_layer.Transform(to_layer)
          else:
              point_layer = point_geo.Clone()

          polar_srs = osr.SpatialReference()
          polar_srs.ImportFromProj4('+proj=stere +lat_0=-90 +lon_0=0 +k=1 +R=1737400 +units=m +no_defs')
          polar_srs.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)
          layer_to_polar = osr.CoordinateTransformation(layer_srs, polar_srs)
          point_xy = point_layer.Clone(); point_xy.Transform(layer_to_polar)

          containing = []
          all_rows = []
          layer.ResetReading()
          for feat in layer:
              geom = feat.GetGeometryRef()
              if geom is None:
                  continue
              attrs = {f: feat.GetField(f) for f in fields}
              contains = bool(geom.Contains(point_layer) or geom.Intersects(point_layer))
              gxy = geom.Clone(); gxy.Transform(layer_to_polar)
              distance_m = float(gxy.Distance(point_xy))
              row = {'contains_site': contains, 'distance_to_footprint_m': distance_m, **attrs}
              all_rows.append(row)
              if contains:
                  containing.append(row)

          all_rows.sort(key=lambda r: r['distance_to_footprint_m'])
          result = {
              'site': {'latitude_deg': lat, 'longitude_east_deg': lon},
              'shapefile': str(shp),
              'layer_srs_wkt': layer_srs.ExportToWkt(),
              'feature_count': layer.GetFeatureCount(),
              'fields': fields,
              'containing_count': len(containing),
              'containing': containing,
              'nearest_30': all_rows[:30],
          }
          Path('out/nac_dtm_query.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('out/nac_dtm_query.txt').write_text(
              'CONTAINING\n' + '\n'.join(str(x) for x in containing) +
              '\n\nNEAREST\n' + '\n'.join(str(x) for x in all_rows[:30]), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          sha256sum data/NAC_DTMS_360.ZIP > out/shapefile_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ce7-nac-dtm-query
          path: out
          if-no-files-found: error
          retention-days: 1
