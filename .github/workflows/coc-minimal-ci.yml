name: CE7 Five-Metre Terrain Inspection

on:
  push:
    branches: [tmp/ce7-illumination-20260822]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install GDAL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin python3-gdal python3-numpy
      - name: Inspect Site04 5 m terrain tile
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p terrain report quicklooks
          curl -L --retry 3 --retry-delay 2 \
            'https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/Site04/Site04_final_adj_5mpp_surf.tif' \
            -o terrain/Site04_final_adj_5mpp_surf.tif
          gdalinfo -json -stats terrain/Site04_final_adj_5mpp_surf.tif > report/Site04.gdalinfo.json
          gdalinfo terrain/Site04_final_adj_5mpp_surf.tif > report/Site04.gdalinfo.txt
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          from osgeo import gdal, osr
          gdal.UseExceptions()
          path='terrain/Site04_final_adj_5mpp_surf.tif'
          ds=gdal.Open(path)
          lat,lon=-88.8,123.5
          dst=osr.SpatialReference(); dst.ImportFromWkt(ds.GetProjection()); dst.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)
          src=osr.SpatialReference(); src.ImportFromProj4('+proj=longlat +R=1737400 +no_defs'); src.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)
          ct=osr.CoordinateTransformation(src,dst)
          x,y,_=ct.TransformPoint(lon,lat)
          inv=gdal.InvGeoTransform(ds.GetGeoTransform())
          px,py=gdal.ApplyGeoTransform(inv,x,y)
          inside=0<=px<ds.RasterXSize and 0<=py<ds.RasterYSize
          band=ds.GetRasterBand(1)
          value=float(band.ReadAsArray(int(px),int(py),1,1)[0,0]) if inside else None
          report={
            'file':Path(path).name,'raster_size':[ds.RasterXSize,ds.RasterYSize],
            'geotransform':list(ds.GetGeoTransform()),'projection_wkt':ds.GetProjection(),
            'site_lon_east_deg':lon,'site_lat_deg':lat,'site_projected_xy':[x,y],
            'site_pixel_xy':[px,py],'inside':inside,'site_value_raw':value,
            'nodata':band.GetNoDataValue(),'metadata':ds.GetMetadata(),
          }
          Path('report/site04_coverage.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          if inside:
            half=min(6000,int(px),int(py),ds.RasterXSize-int(px)-1,ds.RasterYSize-int(py)-1)
            xoff=max(0,int(px)-half); yoff=max(0,int(py)-half)
            xsize=min(ds.RasterXSize-xoff,2*half); ysize=min(ds.RasterYSize-yoff,2*half)
            gdal.Translate('quicklooks/Site04_site.png',ds,options=gdal.TranslateOptions(
              format='PNG',srcWin=[xoff,yoff,xsize,ysize],width=1600,outputType=gdal.GDT_Byte,scaleParams=[[]]))
          PY
          sha256sum terrain/Site04_final_adj_5mpp_surf.tif > report/terrain_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ce7-site04-inspection
          path: |
            report
            quicklooks
          if-no-files-found: error
          retention-days: 1
