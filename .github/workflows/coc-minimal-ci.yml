name: CE7 High-Resolution Terrain Probe

on:
  push:
    branches: [tmp/ce7-illumination-20260822]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install GDAL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin python3-gdal python3-numpy
      - name: Probe cloud-optimized DEMs
        shell: bash
        env:
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.TIF
          GDAL_HTTP_MULTIRANGE: YES
          VSI_CACHE: TRUE
          VSI_CACHE_SIZE: 50000000
        run: |
          set -euxo pipefail
          mkdir -p out
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          from osgeo import gdal, osr
          gdal.UseExceptions()

          urls = {
            'LOLA_5m_87S': 'https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/87S/ldem_87s_5mpp.tif',
            'LOLA_10m_83S': 'https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_83S_10MPP_ADJ.TIF',
            'LOLA_20m_80S': 'https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_80S_20MPP_ADJ.TIF',
          }
          lat, lon = -88.8, 123.5
          results = []
          for name, url in urls.items():
              path = '/vsicurl/' + url
              ds = gdal.Open(path)
              band = ds.GetRasterBand(1)
              dst = osr.SpatialReference(); dst.ImportFromWkt(ds.GetProjection()); dst.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)
              src = osr.SpatialReference(); src.ImportFromProj4('+proj=longlat +R=1737400 +no_defs'); src.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)
              ct = osr.CoordinateTransformation(src, dst)
              x, y, _ = ct.TransformPoint(lon, lat)
              inv = gdal.InvGeoTransform(ds.GetGeoTransform())
              px, py = gdal.ApplyGeoTransform(inv, x, y)
              inside = 0 <= px < ds.RasterXSize and 0 <= py < ds.RasterYSize
              value = float(band.ReadAsArray(int(px), int(py), 1, 1)[0,0]) if inside else None
              # Sample a 2 km square around the site at native resolution where practical.
              half_px = max(1, round(1000 / abs(ds.GetGeoTransform()[1])))
              xoff = max(0, int(px)-half_px); yoff = max(0, int(py)-half_px)
              xsize = min(ds.RasterXSize-xoff, 2*half_px+1); ysize = min(ds.RasterYSize-yoff, 2*half_px+1)
              arr = band.ReadAsArray(xoff, yoff, xsize, ysize)
              stats = {
                  'min': float(arr.min()), 'max': float(arr.max()),
                  'mean': float(arr.mean()), 'std': float(arr.std()),
              }
              results.append({
                  'name': name, 'url': url, 'raster_size': [ds.RasterXSize, ds.RasterYSize],
                  'geotransform': list(ds.GetGeoTransform()), 'projection_wkt': ds.GetProjection(),
                  'site_xy_m': [x,y], 'site_pixel': [px,py], 'inside': inside,
                  'site_elevation_m': value, 'local_2km_stats': stats,
                  'nodata': band.GetNoDataValue(), 'metadata': ds.GetMetadata(),
              })
          Path('out/highres_probe.json').write_text(json.dumps(results, indent=2), encoding='utf-8')
          print(json.dumps(results, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ce7-highres-terrain-probe
          path: out
          if-no-files-found: error
          retention-days: 1
